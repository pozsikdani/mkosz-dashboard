name: Napi dashboard frissítés

# Kétóránként, nem naponta egyszer (2026-11-18). A meccs estéjén felkerülő
# jegyzőkönyv másfél nappal később ért a honlapra. Nem (csak) a csúszás miatt:
# ez a 00:00-s regen mérve 04:07 és 05:56 között indult, a mkosz-stats importja
# viszont 13:44 és 16:23 között — vagyis a regen AZ IMPORT ELŐTT futott, és
# mindig az előző napi adatbázisból épített. Kétóránként ez magától megszűnik:
# minden futás a pillanatnyi adatbázist klónozza.
#
# A :57 perc szándékos — a kerek óra a GitHub ütemezőjének a legterheltebb
# pillanata, és ott a legnagyobb a csúszás. Korai kilépés nincs: a naptár és a
# sorsolás a webről frissül, nem az adatbázisból, tehát a regen akkor is dolgozik,
# ha új meccs nincs; commit pedig eddig is csak változáskor volt.
on:
  schedule:
    - cron: '57 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python csomagok telepítése
        run: pip install PyMuPDF requests beautifulsoup4

      - name: Stats DB letöltése
        run: git clone --depth 1 https://github.com/pozsikdani/mkosz-stats.git /tmp/mkosz-stats

      - name: Scoresheet DB letöltése (Hepp Kupa)
        run: git clone --depth 1 https://github.com/pozsikdani/mkosz-scoresheet.git /tmp/mkosz-scoresheet || true

      - name: Dashboard generálás
        env:
          STATS_DB_PATH: /tmp/mkosz-stats/mkosz_stats.sqlite
          SCORESHEET_DB_PATH: /tmp/mkosz-scoresheet/scoresheet.sqlite
        run: python3 generate_dashboards.py site

      - name: Commit-preview → meccs oldalak stagelése
        run: git add dashboards/meccs/ 2>/dev/null || true

      - name: Commit és push ha változott
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dashboards/ kozgaz-b.ics data/
          git diff --staged --quiet || (
            git commit -m "Napi frissítés (auto): $(date +%Y-%m-%d)" &&
            git push
          )
